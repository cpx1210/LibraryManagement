version: '3.8'

# 离线部署配置 - 使用服务器系统的MySQL数据库
# 适用于内网环境，镜像已提前导入

services:
  # 后端服务
  backend:
    image: library-backend:v1.0
    container_name: library-backend
    restart: always
    environment:
      # Spring Boot配置
      SPRING_PROFILES_ACTIVE: prod
      
      # 数据库连接配置 - 通过host.docker.internal连接宿主机MySQL
      # host.docker.internal 会被解析为宿主机IP
      DB_URL: jdbc:mysql://host.docker.internal:3306/library_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-library_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-library_pass}
      
      # JWT密钥（生产环境请修改）
      JWT_SECRET: ${JWT_SECRET:-library-management-system-secret-key-2024-please-change-in-production}
      
      # JVM参数
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
    
    # 暴露端口
    ports:
      - "8080:8080"
    
    # 添加host.docker.internal映射（Linux系统需要）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    volumes:
      # 日志目录
      - ./logs/backend:/app/logs
      # 上传文件目录
      - ./uploads:/app/uploads
    
    networks:
      - library-network
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    image: library-frontend:v1.0
    container_name: library-frontend
    restart: always
    ports:
      - "3000:80"  # 映射到宿主机3000端口，保留80端口供其他用途
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# 网络配置
networks:
  library-network:
    driver: bridge
