version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-583201844Aa*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-library_management}
      MYSQL_USER: ${MYSQL_USER:-library_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library_pass}
      TZ: Asia/Shanghai
    # 生产环境不暴露数据库端口（更安全）
    # ports:
    #   - "3306:3306"
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 初始化SQL脚本（首次启动时执行）
      - ./library-management-backend/src/main/resources/db/mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./library-management-backend/src/main/resources/db/mysql_data_cn.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./library-management-backend
      dockerfile: Dockerfile
    container_name: library-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Spring Boot配置
      SPRING_PROFILES_ACTIVE: prod
      # 数据库连接（使用服务名mysql作为主机名）
      DB_URL: jdbc:mysql://mysql:3306/library_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-library_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-library_pass}
      # JWT密钥（生产环境请修改）
      JWT_SECRET: ${JWT_SECRET:-library-management-system-secret-key-2024-please-change-in-production}
      # JVM参数
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
    ports:
      - "8080:8080"
    volumes:
      # 日志目录（可选）
      - ./logs/backend:/app/logs
      # 上传文件目录（可选）
      - ./uploads:/app/uploads
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./library-management-frontend
      dockerfile: Dockerfile
    container_name: library-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      # 如果需要HTTPS，可以添加443端口
      # - "443:443"
    volumes:
      # 如果需要自定义nginx配置
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - library-network
    # 前端需要知道后端API地址，可以通过环境变量配置
    # 或者修改nginx配置进行反向代理

# 网络配置
networks:
  library-network:
    driver: bridge

# 数据卷配置
volumes:
  mysql_data:
    driver: local

